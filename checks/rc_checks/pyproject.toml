[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rc_checks"
version = "0.1.0"
description = "Shared static repository, snapshot and dtype checks for Reality Check submissions"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["rc_checks"]

[tool.setuptools.package-data]
rc_checks = ["_release_fallback.json"]
